# ---- Secret: DB password (shared by db + backend) ----
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
type: Opaque
stringData:
  POSTGRES_PASSWORD: secret
---
# ---- PersistentVolumeClaim: keeps DB data if the Pod dies ----
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-pvc
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
# ---- Deployment: manages the Postgres Pod ----
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
spec:
  replicas: 1                 # a DB is stateful — keep 1
  selector:
    matchLabels: { app: db }
  template:
    metadata:
      labels: { app: db }     # this block IS the Pod definition
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: db-secret, key: POSTGRES_PASSWORD }
            - name: POSTGRES_DB
              value: products
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata   # subdir avoids lost+found clash
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            tcpSocket: { port: 5432 }
            initialDelaySeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: db-pvc
---
# ---- Service: stable name "db" for other Pods to reach Postgres ----
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  selector: { app: db }
  ports:
    - port: 5432
      targetPort: 5432
