# ---- Deployment: manages backend Pods (2 replicas) ----
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2                     # 2 copies — load-balanced + survives one dying
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      containers:
        - name: backend
          image: products-backend
          imagePullPolicy: IfNotPresent   # use the local image, don't fetch from registry
          ports:
            - containerPort: 3001
          env:
            - name: PGHOST
              value: db                    # the Service name = how backend finds Postgres
            - name: PGDATABASE
              value: products
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: db-secret, key: POSTGRES_PASSWORD }
          readinessProbe:
            httpGet: { path: /api/products, port: 3001 }
            initialDelaySeconds: 5
---
# ---- Service: stable name "backend" for nginx to reach the API ----
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector: { app: backend }
  ports:
    - port: 3001
      targetPort: 3001
